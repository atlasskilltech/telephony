openapi: 3.0.3
info:
  title: ATLAS Telephony & Cloud Telephony API
  version: 1.0.0
  description: >-
    REST API for the AI-Powered ATLAS Telephony platform. JWT bearer auth; rotating refresh
    tokens. Import into Swagger UI or Postman.
servers:
  - url: '{baseUrl}/api/v1'
    variables:
      baseUrl:
        default: http://localhost:3000
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Envelope:
      type: object
      properties:
        success: { type: boolean }
        message: { type: string }
        data: {}
        meta: { type: object }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
        device_name: { type: string }
    LeadCreate:
      type: object
      required: [first_name, phone]
      properties:
        first_name: { type: string }
        last_name: { type: string }
        phone: { type: string }
        email: { type: string, format: email }
        course: { type: string }
        city: { type: string }
        source_id: { type: integer }
        priority: { type: string, enum: [low, medium, high, hot] }
        auto_assign: { type: boolean }
        strategy: { type: string, enum: [round_robin, course_wise, city_wise, team_wise, manual] }
    ClickToCall:
      type: object
      properties:
        lead_id: { type: integer }
        to_number: { type: string }
security:
  - bearerAuth: []
paths:
  /health:
    get:
      summary: Health check
      security: []
      responses: { '200': { description: OK } }
  /auth/login:
    post:
      summary: Login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200': { description: Tokens + user }
        '401': { description: Invalid credentials }
        '422': { description: Validation error }
  /auth/refresh:
    post:
      summary: Rotate refresh token
      security: []
      responses: { '200': { description: New token pair } }
  /auth/me:
    get:
      summary: Current user + permissions
      responses: { '200': { description: User } }
  /dashboard:
    get:
      summary: Dashboard overview (stats, funnel, trend)
      responses: { '200': { description: Overview } }
  /dashboard/call-analytics:
    get:
      summary: Call-QA analytics (metrics, score trend, sentiment, QA radar, leaderboard, recent calls)
      parameters:
        - { name: days, in: query, schema: { type: integer, default: 30 } }
      responses: { '200': { description: Call analytics } }
  /leads:
    get:
      summary: List leads
      parameters:
        - { name: page, in: query, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer } }
        - { name: search, in: query, schema: { type: string } }
        - { name: pipeline_stage, in: query, schema: { type: string } }
        - { name: course, in: query, schema: { type: string } }
        - { name: city, in: query, schema: { type: string } }
      responses: { '200': { description: Paginated leads } }
    post:
      summary: Create lead
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LeadCreate' }
      responses: { '201': { description: Created } }
  /leads/{id}:
    get:
      summary: Get lead
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { description: Lead }, '404': { description: Not found } }
    put:
      summary: Update lead
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { description: Updated } }
    delete:
      summary: Delete lead
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { description: Deleted } }
  /leads/{id}/assign:
    post:
      summary: Assign lead
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { description: Assigned } }
  /leads/import/preview:
    post:
      summary: Preview an Excel/CSV import (column mapping + validation)
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties: { file: { type: string, format: binary } }
      responses: { '200': { description: Preview } }
  /calls:
    get:
      summary: List calls (paginated; counselors see only their own)
      parameters:
        - { name: page, in: query, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer } }
        - { name: lead_id, in: query, schema: { type: integer } }
        - { name: status, in: query, schema: { type: string } }
      responses: { '200': { description: Paginated calls } }
  /calls/upload-recording:
    post:
      summary: Upload a mobile-dialer call recording + metadata
      description: >-
        Mobile flow (no telephony provider): the agent calls from their phone
        and the app uploads the recording here. Stores the audio to S3/local,
        creates the call_logs + call_recordings rows (archived) and runs
        transcription/analysis. Idempotent on client_call_id. The recording file
        is required for connected calls but optional for missed calls
        (is_missed=true or status=missed), which are logged without audio.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                recording: { type: string, format: binary, description: 'Required for connected calls; optional for missed calls (is_missed=true or status=missed)' }
                lead_id: { type: integer }
                to_number: { type: string }
                from_number: { type: string }
                direction: { type: string, enum: [outbound, inbound] }
                status: { type: string }
                duration_seconds: { type: integer }
                talk_time_seconds: { type: integer }
                started_at: { type: string, format: date-time }
                ended_at: { type: string, format: date-time }
                is_missed: { type: boolean }
                client_call_id: { type: string }
      responses:
        '201': { description: Recording stored (call incl. recording) }
        '400': { description: Missing/invalid file or destination number }
  /calls/click-to-call:
    post:
      summary: Initiate a click-to-call (only if a cloud provider is configured)
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClickToCall' }
      responses: { '201': { description: Call initiated } }
  /calls/{id}:
    get:
      summary: Get a call with recording, transcript and AI analysis
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { description: Call } }
  /calls/{id}/retry-transcription:
    post:
      summary: Re-queue transcription + analysis for a stored recording
      description: >-
        Re-runs the pipeline for an existing call without re-uploading. Useful
        for recovering calls whose jobs previously failed.
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { description: Transcription re-queued }
        '404': { description: No recording for this call }
  /calls/{id}/recording-url:
    get:
      summary: Get a time-limited URL for the archived recording
      description: >-
        Returns `{ data: { url } }`. For S3 the URL is a presigned GetObject
        link valid for 15 minutes; for local storage it is the stream route.
        404 if the recording has not been archived yet.
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { description: Signed/stream URL }
        '404': { description: Recording not available }
  /calls/recordings/stream:
    get:
      summary: Stream a local-storage recording (STORAGE_DRIVER=local)
      parameters:
        - { name: key, in: query, required: true, schema: { type: string } }
      responses:
        '200': { description: audio/mpeg stream }
        '400': { description: Missing key }
  /telephony/webhook/{provider}:
    post:
      summary: Provider status callback (signature-verified)
      description: >-
        Public, no auth — verified by the provider signature. Idempotent on
        provider_call_id. On a completed call with a recording it creates a
        pending recording and enqueues transcription + storage archival.
      security: []
      parameters:
        - { name: provider, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Accepted }
        '401': { description: Invalid signature }
  /followups:
    get: { summary: List follow-ups, responses: { '200': { description: OK } } }
    post: { summary: Create follow-up, responses: { '201': { description: Created } } }
  /reports/{type}:
    get:
      summary: Get a report
      parameters:
        - name: type
          in: path
          required: true
          schema: { type: string, enum: [counselor-performance, lead-source, course, admission-funnel] }
      responses: { '200': { description: Report } }
  /notifications:
    get: { summary: List notifications, responses: { '200': { description: OK } } }
