# Reverse proxy for the Admission CRM. Terminates HTTP(S), proxies to the
# Node app and upgrades WebSocket connections for Socket.IO.

upstream crm_app {
    server web:3000;
    keepalive 32;
}

# Redirect HTTP -> HTTPS in production (uncomment once certs are mounted).
# server {
#     listen 80;
#     server_name _;
#     return 301 https://$host$request_uri;
# }

server {
    listen 80;
    server_name _;

    client_max_body_size 20m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Static assets served directly with long cache.
    location /public/ {
        proxy_pass http://crm_app;
        proxy_cache_valid 200 7d;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Socket.IO websocket upgrade.
    location /socket.io/ {
        proxy_pass http://crm_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    location / {
        proxy_pass http://crm_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

